name: "Publish release"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Get version
        id: get-version
        shell: pwsh
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          echo "::set-output name=version::$(echo $json.version)"
      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3.4.1
        with:
          node-version: 20.x
          cache: "pnpm"
      - name: Build & zip the Chrome extension
        run: pnpm zip
      - name: Build & zip the Firefox extension
        run: pnpm zip:firefox
      - name: Rename extension files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $chromeZip = Get-ChildItem .output/*-chrome.zip | Select-Object -First 1
          $firefoxZip = Get-ChildItem .output/*-firefox.zip | Select-Object -First 1
          Copy-Item $chromeZip.FullName build/${{ steps.get-version.outputs.version }}_chrome-mv3.zip
          Copy-Item $chromeZip.FullName build/${{ steps.get-version.outputs.version }}_edge-mv3.zip
          Copy-Item $chromeZip.FullName build/${{ steps.get-version.outputs.version }}_opera-mv3.zip
          Copy-Item $firefoxZip.FullName build/${{ steps.get-version.outputs.version }}_firefox-mv3.zip
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          files: build/*.zip
      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3.8.0
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          chrome-file: build/${{ steps.get-version.outputs.version }}_chrome-mv3.zip
          firefox-file: build/${{ steps.get-version.outputs.version }}_firefox-mv3.zip
          verbose: true
